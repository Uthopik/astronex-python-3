name: Build macOS DMG (ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python NATIVO ARM64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Instalar dependencias de sistema con Homebrew
        run: |
          # Forzar la instalación de dependencias GTK3 sin bloquear por archivos existentes
          brew update
          brew install gtk+3 cairo pygobject3 adwaita-icon-theme pkg-config || brew link --overwrite gtk+3 cairo pygobject3

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller dmgbuild configobj pillow tzdata
          pip install pyswisseph

      - name: Crear paquete .app con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "Astro-Nex" \
            --target-arch arm64 \
            --add-data "astronex/resources/Astro-Nex.ttf:astronex/resources" \
            --add-data "astronex/resources/astronex.png:astronex/resources" \
            --add-data "astronex/locale:astronex/locale" \
            --collect-all gi \
            --collect-all cairo \
            nex.py

      - name: Generar el archivo .dmg
        run: |
          # Crear la imagen DMG a partir del paquete .app generado
          dmgbuild -s /dev/null "Astro-Nex" dist/Astro-Nex-ARM64.dmg -s - || hdiutil create -volname "Astro-Nex" -srcfolder dist/Astro-Nex.app -ov -format UDZO dist/Astro-Nex-ARM64.dmg

      - name: Subir el .dmg como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Nex-macOS-ARM64-DMG
          path: dist/Astro-Nex-ARM64.dmg
