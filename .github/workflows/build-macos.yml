name: Build macOS DMG (ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python NATIVO ARM64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Instalar dependencias del sistema con Homebrew
        run: |
          brew update
          brew install gtk+3 cairo pygobject3 adwaita-icon-theme pkg-config expat harfbuzz freetype graphite2 gobject-introspection

      - name: Preparar entorno virtual y compilar PyGObject
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel pyinstaller pytz configobj Pillow
          
          # Configurar rutas de pkg-config para que pip encuentre PyGObject y Cairo en Homebrew
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/libffi/lib/pkgconfig"
          
          # Forzar la instalación de PyGObject y PyCairo dentro de .venv
          pip install pycairo PyGObject
          pip install pyswisseph
          pip install -e .

      - name: Generar icono .icns para macOS
        run: |
          source .venv/bin/activate
          mkdir -p build/Astro-Nex.iconset
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          source = Image.open("astronex/resources/nex.ico").convert("RGBA")
          iconset = Path("build/Astro-Nex.iconset")
          for size in (16, 32, 128, 256, 512):
              for pixels, suffix in ((size, ""), (size * 2, "@2x")):
                  image = source.resize((pixels, pixels), Image.Resampling.LANCZOS)
                  image.save(iconset / f"icon_{size}x{size}{suffix}.png")
          PY
          iconutil -c icns build/Astro-Nex.iconset -o build/Astro-Nex.icns

      - name: Crear paquete con PyInstaller
        run: |
          source .venv/bin/activate
          
          BREW_PREFIX=$(brew --prefix)
          export DYLD_LIBRARY_PATH="$BREW_PREFIX/lib:$DYLD_LIBRARY_PATH"
          export GI_TYPELIB_PATH="$BREW_PREFIX/lib/girepository-1.0:$GI_TYPELIB_PATH"

          # Generar el archivo astronex.spec dinámicamente con ATSApplicationFontsPath
          cat <<EOF > astronex.spec
          # -*- mode: python ; coding: utf-8 -*-
          from PyInstaller.utils.hooks import collect_all

          datas = [
              ('$BREW_PREFIX/lib/girepository-1.0', 'gi_typelibs'),
              ('astronex/resources', 'astronex/resources'),
              ('astronex/resources', 'resources'),
              ('astronex/db', 'astronex/db'),
              ('astronex/db', 'db'),
              ('astronex/locale', 'astronex/locale'),
              ('astronex/locale', 'locale'),
          ]
          hiddenimports = [
              'gi', 'gi.repository.Gtk', 'gi.repository.Gdk', 
              'gi.repository.GLib', 'gi.repository.GObject', 
              'gi.repository.Gio', 'gi.repository.Pango', 
              'gi.repository.PangoCairo', 'gi.repository.GdkPixbuf', 
              'pyswisseph', 'PIL.Image', 'PIL.ImageOps'
          ]

          for pkg in ['gi', 'cairo', 'pyswisseph']:
              d, b, h = collect_all(pkg)
              datas += d
              hiddenimports += h

          a = Analysis(
              ['nex.py'],
              pathex=['$BREW_PREFIX/lib', '.venv/lib/python3.11/site-packages'],
              binaries=[],
              datas=datas,
              hiddenimports=hiddenimports,
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              noarchive=False,
          )
          pyz = PYZ(a.pure)

          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name='Astro-Nex',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )

          coll = COLLECT(
              exe,
              a.binaries,
              a.datas,
              strip=False,
              upx=True,
              upx_exclude=[],
              name='Astro-Nex',
          )

          app = BUNDLE(
              coll,
              name='Astro-Nex.app',
              icon='build/Astro-Nex.icns',
              bundle_identifier='org.astronex.app',
              info_plist={
                  'CFBundleName': 'Astro-Nex',
                  'CFBundleDisplayName': 'Astro-Nex',
                  'CFBundleIdentifier': 'org.astronex.app',
                  'NSHighResolutionCapable': 'True',
                  'ATSApplicationFontsPath': 'resources',
              },
          )
          EOF

          # Compilar directamente usando el archivo .spec generado
          pyinstaller --noconfirm --clean astronex.spec

      - name: Ajustar parches de HarfBuzz y Expat (Rpath macOS)
        run: |
          source .venv/bin/activate
          APP_PATH="dist/Astro-Nex.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          HARFBUZZ_BUNDLE="$FRAMEWORKS_DIR/PIL/.dylibs/libharfbuzz.0.dylib"

          # Reemplazar libharfbuzz de Pillow por la de Homebrew si existe
          HARFBUZZ_PREFIX=$(brew --prefix harfbuzz)
          FREETYPE_PREFIX=$(brew --prefix freetype)
          if [ -f "$HARFBUZZ_BUNDLE" ]; then
            cp "$HARFBUZZ_PREFIX/lib/libharfbuzz.0.dylib" "$HARFBUZZ_BUNDLE"
            install_name_tool -id @rpath/libharfbuzz.0.dylib "$HARFBUZZ_BUNDLE" || true
            install_name_tool -change "$FREETYPE_PREFIX/lib/libfreetype.6.dylib" @loader_path/libfreetype.6.dylib "$HARFBUZZ_BUNDLE" || true
            install_name_tool -change "$(brew --prefix glib)/lib/libglib-2.0.0.dylib" @rpath/libglib-2.0.0.dylib "$HARFBUZZ_BUNDLE" || true
            install_name_tool -change "$(brew --prefix graphite2)/lib/libgraphite2.3.dylib" @rpath/libgraphite2.3.dylib "$HARFBUZZ_BUNDLE" || true
          fi

      - name: Firmado ad-hoc de la aplicación
        run: |
          codesign --force --deep --sign - "dist/Astro-Nex.app"

      - name: Comprobar el tamaño del bundle generado
        run: |
          du -sh dist/Astro-Nex.app

      - name: Generar el archivo .dmg directo con hdiutil
        run: |
          hdiutil create -ov -volname "Astro-Nex" -srcfolder dist/Astro-Nex.app -format UDZO dist/Astro-Nex-v2.0-macOS-arm64.dmg

      - name: Subir el .dmg como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Nex-macOS-ARM64-DMG
          path: dist/Astro-Nex-v2.0-macOS-arm64.dmg
