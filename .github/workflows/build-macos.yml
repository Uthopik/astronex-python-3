name: Build macOS DMG (ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python NATIVO ARM64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Instalar dependencias de sistema con Homebrew
        run: |
          brew update
          brew install gtk+3 cairo pygobject3 adwaita-icon-theme pkg-config || brew link --overwrite gtk+3 cairo pygobject3

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller configobj pillow tzdata
          pip install pyswisseph

      - name: Crear paquete .app completo con PyInstaller
        run: |
          # Incluir manualmente las dylib clave de GTK3 y Homebrew dentro de la app
          pyinstaller --noconfirm --onedir --windowed \
            --name "Astro-Nex" \
            --target-arch arm64 \
            --add-data "astronex/resources/Astro-Nex.ttf:astronex/resources" \
            --add-data "astronex/resources/astronex.png:astronex/resources" \
            --add-data "astronex/locale:astronex/locale" \
            --add-binary "/opt/homebrew/lib/libgtk-3.0.dylib:." \
            --add-binary "/opt/homebrew/lib/libcairo.2.dylib:." \
            --add-binary "/opt/homebrew/lib/libgdk-3.0.dylib:." \
            --add-binary "/opt/homebrew/lib/libpango-1.0.dylib:." \
            --add-binary "/opt/homebrew/lib/libgobject-2.0.dylib:." \
            --add-binary "/opt/homebrew/lib/libglib-2.0.dylib:." \
            --add-binary "/opt/homebrew/lib/libgio-2.0.dylib:." \
            --add-binary "/opt/homebrew/lib/libgdk_pixbuf-2.0.dylib:." \
            --collect-all gi \
            --collect-all cairo \
            nex.py

      - name: Verificar tamaño del bundle .app
        run: |
          du -sh dist/Astro-Nex.app

      - name: Generar el archivo .dmg directo con hdiutil
        run: |
          hdiutil create -volname "Astro-Nex" -srcfolder dist/Astro-Nex.app -ov -format UDZO dist/Astro-Nex-ARM64.dmg

      - name: Subir el .dmg como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Nex-macOS-ARM64-DMG
          path: dist/Astro-Nex-ARM64.dmg
