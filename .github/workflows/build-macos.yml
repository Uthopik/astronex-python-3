name: Build macOS DMG

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cuando creas un tag (ej. v2.1)
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build-macos:
    runs-on: macos-13 # Utiliza runners Intel para máxima compatibilidad via Rosetta 2

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de sistema (GTK3 y Cairo)
        run: |
          brew update
          brew install gtk+3 cairo pygobject3 adwaita-icon-theme

      - name: Instalar dependencias de Python y empaquetadores
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller dmgbuild configobj pillow tzdata
          # Instalar pyswisseph desde fuente
          pip install pyswisseph

      - name: Crear ejecutable/bundle .app con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "Astro-Nex" \
            --add-data "astronex/resources/Astro-Nex.ttf:astronex/resources" \
            --add-data "astronex/resources/astronex.png:astronex/resources" \
            --add-data "astronex/locale:astronex/locale" \
            --collect-all gi \
            --collect-all cairo \
            nex.py

      - name: Generar el archivo .dmg
        run: |
          pip install dmgbuild
          dmgbuild -s -settings-s "Astro-Nex" dist/Astro-Nex.app dist/Astro-Nex.dmg

      - name: Subir el .dmg como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Nex-macOS-DMG
          path: dist/Astro-Nex.dmg
