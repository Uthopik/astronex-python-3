name: Build macOS DMG (ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python NATIVO ARM64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Instalar dependencias de sistema con Homebrew
        run: |
          brew update
          brew install gtk+3 cairo pygobject3 adwaita-icon-theme pkg-config || brew link --overwrite gtk+3 cairo pygobject3

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller configobj pillow tzdata
          pip install pyswisseph

      - name: Crear paquete .app completo con PyInstaller
        run: |
          # Vincular librerías dinámicas de Homebrew para que PyInstaller las arrastre
          export DYLD_LIBRARY_PATH="/opt/homebrew/lib:$DYLD_LIBRARY_PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"

          pyinstaller --noconfirm --onedir --windowed \
            --name "Astro-Nex" \
            --target-arch arm64 \
            --add-data "astronex/resources/Astro-Nex.ttf:astronex/resources" \
            --add-data "astronex/resources/astronex.png:astronex/resources" \
            --add-data "astronex/locale:astronex/locale" \
            --collect-binaries gi \
            --collect-binaries cairo \
            --collect-data gi \
            --collect-data cairo \
            nex.py

      - name: Generar el archivo .dmg directo con hdiutil
        run: |
          hdiutil create -volname "Astro-Nex" -srcfolder dist/Astro-Nex.app -ov -format UDZO dist/Astro-Nex-ARM64.dmg

      - name: Subir el .dmg como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Nex-macOS-ARM64-DMG
          path: dist/Astro-Nex-ARM64.dmg
